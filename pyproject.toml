[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "familylink-worker"
version = "1.0.0"
description = "Hardened, human-in-the-loop Termux assistant for authorized Google Family Link actions."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
]

[project.scripts]
familylink = "familylink.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["familylink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
