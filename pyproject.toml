[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "antwork"
version = "0.1.0"
description = "Private browser worker control panel"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn[standard]==0.53.0", "playwright==1.63.0", "starlette==1.7.0"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["antwork*"]

[tool.setuptools.package-data]
antwork = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
